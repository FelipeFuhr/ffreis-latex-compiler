name: Build All (Go Matrix)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-cross-build-matrix.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25.10"
      # PR builds linux only (x both arches). Full GOOS matrix (linux/darwin/
      # windows) runs on push to main and on manual workflow_dispatch. These are
      # cross-compiles on ubuntu (1x billing) but 6 jobs/PR-iteration adds up.
      goos: ${{ github.event_name == 'pull_request' && 'linux' || 'linux,darwin,windows' }}
      working-directory: "."
      targets: |-
        ./cmd/ffreis-latex-compiler
